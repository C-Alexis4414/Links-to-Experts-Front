name: Cypress Tests

on:
    push:
        branches:
        - main
    pull_request:
        branches:
        - main

jobs:
    cypress-run:
        runs-on: ubuntu-latest
        name: E2E Tests
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Cypress run
              uses: cypress-io/github-action@v6
              with:
                browser: chrome
                env: |
                    TAG_CHANNEL: ${{ secrets.TAG_CHANNEL }}
                    URL_PRO: ${{ secrets.URL_PRO }}
                    URL_BACKEND: ${{ secrets.URL_BACKEND }}



